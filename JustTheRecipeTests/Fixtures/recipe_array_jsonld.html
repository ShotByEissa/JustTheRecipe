    [

            "recipeYield": "6 servings",
            "recipeIngredient": [
                "2 cans (28 oz each) whole peeled tomatoes",
                "1 medium onion, diced",
                "4 cloves garlic, minced",
                "2 cups vegetable broth",
                "2 tablespoons butter",
                "1 teaspoon sugar",
                "1/2 cup heavy cream",

                "Salt and pepper to taste"
            ],
            "recipeInstructions": "1. Melt butter in a large pot over medium heat.\n2. Add onion and cook until softened, about 5 minutes.\n3. Add garlic and cook for 1 minute.\n4. Pour in tomatoes and broth. Add sugar.\n5. Bring to a boil, then reduce heat and simmer for 20 minutes.\n6. Use an immersion blender to puree until smooth.\n7. Stir in heavy cream and season with salt and pepper.\n8. Serve hot, garnished with fresh basil."
